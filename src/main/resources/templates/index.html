<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 850px; margin: 40px auto; padding: 0 18px; color: #222; }
        h1 { color: #2457a7; }
        .product { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin: 12px 0; }
        .price { color: #147a3d; font-weight: bold; }
        code { background: #f2f2f2; padding: 3px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Welcome to the Shopping Cart</h1>
    <p>Your Java web application is running successfully.</p>

    <h2>Available products</h2>
    <div th:each="product : ${products}" class="product">
        <h3 th:text="${product.name}">Product name</h3>
        <p>Product ID: <span th:text="${product.id}">1</span></p>
        <p class="price">
            ₹<span th:text="${product.price}">0.00</span>
        </p>
    </div>

    <p>REST API: <code>/api/products</code></p>
</body>
</html>
